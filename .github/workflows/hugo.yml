name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main", "master", "jules*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'

      - name: Install dependencies
        run: npm install

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build CSS and Site
        run: |
          # 1. Generate theme colors
          node scripts/themeGenerator.js || true

          # 2. Vendor Hugo modules to get original assets
          hugo mod vendor

          # 3. Consolidate all CSS in assets/css using the Python script
          # This handles imports, Scss mapping, and missing file fallbacks
          python3 scripts/consolidate_assets.py

          # Debug: List consolidated assets
          echo "Listing consolidated assets in assets/css/:"
          ls -la assets/css/

          # 4. Build Tailwind CSS explicitly via CLI
          # Ensure execution permissions (though usually fine via npm)
          chmod +x ./node_modules/.bin/tailwindcss
          ./node_modules/.bin/tailwindcss -i assets/css/main.css -o assets/css/tailwind-built.css --minify

          # 5. Run Hugo with the dynamic baseURL
          # We force sync static to ensure everything is in place
          hugo \
            --gc \
            --minify \
            --forceSyncStatic \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
